<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幾何工作紙 6.2 - 線段的比較與運算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#F6F7F2; --grid:#E2E7EC; --card:#FFFFFF; --ink:#1E2833; --muted:#65717D;
  --pencil:#2F5DA8; --pencil-soft:#E3EBF7; --red:#C23B2A; --red-soft:#FBE6E2; --hi:#F3E07A;
  --amber:#A8660F; --amber-soft:#FBF0DC;
  --line:#1E2833; --btn:#1E2833; --btn-ink:#FFFFFF;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131920; --grid:#1F2831; --card:#1A222B; --ink:#E5E9EF; --muted:#94A1AE;
    --pencil:#82A8EA; --pencil-soft:#1E2C44; --red:#F2806E; --red-soft:#3A1F1B; --hi:#5E5320;
    --amber:#E8B25E; --amber-soft:#3A2D16;
    --line:#E5E9EF; --btn:#E5E9EF; --btn-ink:#131920;
  }
}
:root[data-theme="dark"]{
  --paper:#131920; --grid:#1F2831; --card:#1A222B; --ink:#E5E9EF; --muted:#94A1AE;
  --pencil:#82A8EA; --pencil-soft:#1E2C44; --red:#F2806E; --red-soft:#3A1F1B; --hi:#5E5320;
  --amber:#E8B25E; --amber-soft:#3A2D16;
  --line:#E5E9EF; --btn:#E5E9EF; --btn-ink:#131920;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.7;
  padding-inline:16px; padding-block:24px 48px;
}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
var{font-family:var(--math);font-style:italic;font-size:1.08em;letter-spacing:.02em}
/* 正式分數 */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
  font-family:var(--math);font-style:normal;font-size:.9em;line-height:1.1;margin:0 .12em;position:relative;top:-.08em}
.frac>span{padding:0 .22em}
.frac>span:first-child{border-bottom:1.4px solid currentColor;padding-bottom:1px}
.frac>span:last-child{padding-top:1px}

header .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3.4vw,32px);line-height:1.25;margin:.15em 0 0;text-wrap:balance}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border-color:var(--grid);background:var(--card);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

.card{background:var(--card);border:1px solid var(--grid);border-radius:6px}
.problem{padding:14px 20px}
.problem p{margin:0 0 4px}
.problem ol{margin:0;padding-left:0;list-style:none;display:grid;gap:0}
.problem li span{font-family:var(--mono);font-size:13px;color:var(--muted);margin-right:6px}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.work{padding:16px 18px 20px}
.work h2{font-family:var(--serif);font-size:18px;margin:0}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.stage{padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}

.ph{font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:3px;white-space:nowrap;letter-spacing:.04em}
.ph.goal{background:var(--amber-soft);color:var(--amber)}
.ph.back{background:var(--pencil-soft);color:var(--pencil)}
.ph.calc{background:transparent;color:var(--ink);border:1px solid var(--grid)}
.ph.ans{background:var(--red-soft);color:var(--red)}
.ph.known{background:transparent;color:var(--muted);border:1px solid var(--grid)}

.cap-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:2.4em}
#part{font-family:var(--mono);font-size:13px;color:var(--muted)}
#cap{font-size:18px;font-weight:500;text-wrap:balance;flex-basis:100%}
.fig{overflow-x:auto}
svg{display:block;width:100%;min-width:540px;height:auto}
.axis{stroke:var(--line);stroke-width:2.2;fill:none}
.ext{stroke:var(--line);stroke-width:2;stroke-dasharray:5 5;fill:none;opacity:0;transition:opacity .5s}
.ext.on{opacity:.55}
.tk{stroke:var(--pencil);stroke-width:1.6;opacity:0;transition:opacity .5s}
.tk.on{opacity:.9}
.pt{opacity:0;transition:opacity .45s}
.pt.on{opacity:1}
.pt line{stroke:var(--line);stroke-width:2}
.pt circle{fill:var(--line)}
.pt .lb{font-family:var(--math);font-style:italic;font-size:22px;fill:var(--ink);text-anchor:middle}
.pt .co{font-family:var(--mono);font-size:11px;fill:var(--muted);text-anchor:middle}
.pt.new circle{fill:var(--pencil)}
.pt.new .lb{fill:var(--pencil);font-weight:600}
.br{opacity:0;transition:opacity .4s,transform .55s cubic-bezier(.3,.7,.3,1)}
.br.on{opacity:1}
.br path{fill:none;stroke-width:1.6;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .7s ease-out}
.br.on path{stroke-dashoffset:0}
.br text{font-family:var(--mono);font-size:14px;font-weight:600;text-anchor:middle}
.br text.alg{font-family:var(--math);font-style:italic;font-size:18px}
.br .hl{fill:var(--hi);opacity:0;transition:opacity .4s}
.br.k path{stroke:var(--muted)} .br.k text{fill:var(--muted)}
.br.g path{stroke:var(--ink);stroke-width:2.4} .br.g text{fill:var(--ink);font-size:15px}
.br.d path{stroke:var(--pencil)} .br.d text{fill:var(--pencil)}
.br.q path{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 4;stroke-dashoffset:0;transition:none}
.br.q text{fill:var(--amber);font-size:16px}
.br.a path{stroke:var(--red);stroke-width:2.4} .br.a text{fill:var(--red);font-size:16px}
.br.a .hl{opacity:.85}
.runner{fill:var(--pencil)}
.note{font-size:12px;color:var(--muted);margin:0}
.sw{display:inline-block;width:18px;height:0;border-top:2px solid}
.sw.q{border-top:2px dashed var(--amber)} .sw.g{border-color:var(--ink)} .sw.d{border-color:var(--pencil)} .sw.a{border-color:var(--red)}

.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 13px;border-radius:4px;cursor:pointer}
button.primary{background:var(--btn);color:var(--btn-ink)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,#lines li:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.scrub{flex:1 1 160px;display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;accent-color:var(--pencil);min-width:0}
#count{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

#lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
#lines h3{font-family:var(--serif);font-size:15px;font-weight:600;margin:14px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--grid)}
#lines h4{font-size:13px;font-weight:500;color:var(--muted);margin:8px 0 0 4px}
#lines li{display:grid;grid-template-columns:3.6em 1fr;gap:8px;align-items:center;padding:3px 8px;border-left:3px solid transparent;border-radius:0 3px 3px 0;transition:background .3s;cursor:pointer}
#lines li .ph{justify-self:start}
#lines li.back .tx{color:var(--pencil)}
#lines li.back .tx::before{content:"⟸ ";font-family:var(--math)}
#lines li.goal .tx{font-weight:700}
#lines li.now{background:var(--pencil-soft);border-left-color:var(--pencil)}
#lines li b{font-family:var(--math);font-weight:600}
#lines li b.r{color:var(--red)}
#lines [hidden]{display:none!important}
.final{display:inline-block;padding:2px 10px;border:2px solid var(--red);color:var(--red);border-radius:3px;font-weight:700}

@media (max-width: 860px){
  .main{grid-template-columns:1fr}
  .stage{position:static;order:-1}
}
@media (prefers-reduced-motion: reduce){
  .pt,.br,.br path,.ext,.tk,.br .hl,#lines li{transition:none!important}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">幾何工作紙 6.2 · 線段的比較與運算</div>
    <h1>由問題倒推，再順算回去</h1>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="選擇題目"></nav>

  <section class="card problem" id="stmt"></section>

  <div class="main">
    <section class="card work">
      <h2>計算過程</h2>
      <div class="legend">
        <span><span class="ph goal">目標</span>要求的量</span>
        <span><span class="ph back">反推</span>要它，先要什麼</span>
        <span><span class="ph calc">計算</span>由已知順算回去</span>
      </div>
      <ul id="lines"></ul>
    </section>

    <section class="card stage" aria-live="polite">
      <div class="cap-row"><span class="ph" id="tag"></span><span id="part"></span><span id="cap"></span></div>
      <div class="fig"><svg id="svg" viewBox="0 0 900 250" role="img" aria-label="數線上的線段與各點"></svg></div>
      <div class="legend">
        <span><span class="sw q"></span>待求（?）</span>
        <span><span class="sw g"></span>用到的已知</span>
        <span><span class="sw d"></span>算出的</span>
        <span><span class="sw a"></span>答案</span>
      </div>
      <p class="note">圖下小字為各點位置（以 A 為 0）。</p>
      <div class="controls">
        <button id="reset" type="button">重來</button>
        <button id="prev" type="button">‹ 上一步</button>
        <button id="play" type="button" class="primary">▶ 自動播放</button>
        <button id="next" type="button">下一步 ›</button>
        <div class="scrub"><input id="range" type="range" min="0" value="0" aria-label="步驟"><span id="count"></span></div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const Y=170, GAP=28, X0=40, W=820;
let MIN=0, MAX=1;
const x=v=>X0+(v-MIN)*W/(MAX-MIN);

const F=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const h=F(1,2);
const X='<var>x</var>';
const V=s=>s.replace(/(^|[^A-Za-z<\/="-])([A-Z]{1,2})(?![A-Za-z])/g,'$1<var>$2</var>');
const PHN={known:'已知',goal:'目標',back:'反推',calc:'計算',ans:'答案'};

/* ================= 題目資料 ================= */
const PROBS=[
/* ---------- 第 4 題 ---------- */
{id:'q4',tab:'第 4 題',range:[-4,42],
 stmt:`<p>點 C 在線段 AB 上，AB = 40 cm，AC = 16 cm，點 M、N 分別是 AB、BC 的中點。</p>
  <ol><li><span>(1)</span>求 BN 的長度</li><li><span>(2)</span>求 MN 的長度</li>
  <li><span>(3)</span>若點 P 在直線 AB 上，且 PA = 2 cm，點 Q 為 BP 的中點，求 QN 的長度</li></ol>`,
 groups:{'已知':'已知條件','(1)':'(1) 求 BN','(2)':'(2) 求 MN','(3)':'(3) 求 QN','答案':'答'},
 subs:{'(3) 情況一':'情況一：P 在 A 右邊（線段 AB 上）','(3) 情況二':'情況二：P 在 A 左邊（BA 延長線上）'},
 pts:{A:[0,'A'],B:[40,'B'],C:[16,'C'],M:[20,'M'],N:[28,'N'],P1:[2,'P₁'],Q1:[21,'Q₁'],P2:[-2,'P₂'],Q2:[19,'Q₂']},
 br:{AB:[0,40,'40'],AC:[0,16,'16'],CB:[16,40,'24'],CN:[16,28,'12'],NB:[28,40,'12'],
  AM:[0,20,'20'],MB:[20,40,'20'],MN:[20,28,'8'],
  PA1:[0,2,'2'],P1B:[2,40,'38'],Q1B:[21,40,'19'],Q1N:[21,28,'7'],
  PA2:[-2,0,'2'],P2B:[-2,40,'42'],Q2B:[19,40,'21'],Q2N:[19,28,'9']},
 steps:[
 {part:'已知',ph:'known',cap:'已知 AB = 40 cm，AC = 16 cm。',pts:'A B C',br:{AC:[1,'k'],AB:[3,'k']},
  ln:'AB = 40 cm，AC = 16 cm；M、N 分別是 AB、BC 的中點'},
 {part:'(1)',ph:'goal',cap:'題目要求 BN。',pts:'A B C N',br:{AC:[1,'k'],NB:[1,'q','?'],AB:[3,'k']},ln:'BN = ?'},
 {part:'(1)',ph:'back',cap:`N 是 BC 的中點，所以 BN = ${h}BC。要求 BN，得先知道 BC。`,pts:'A B C N',br:{AC:[1,'k'],NB:[1,'q','?'],CB:[2,'q','?'],AB:[3,'k']},
  ln:`N 是 BC 中點，BN = ${h}BC　→ 需要 BC`},
 {part:'(1)',ph:'back',cap:'BC = AB − AC，而 AB、AC 題目都給了。倒推到已知，可以開始算。',pts:'A B C N',br:{AC:[1,'g'],NB:[1,'q','?'],CB:[2,'q','?'],AB:[3,'g']},
  ln:'BC = AB − AC，AB、AC 都已知 ✓'},
 {part:'(1)',ph:'calc',cap:'BC = AB − AC = 40 − 16 = 24 cm',pts:'A B C N',br:{AC:[1,'k'],NB:[1,'q','?'],CB:[2,'d'],AB:[3,'k']},
  ln:'BC = AB − AC = 40 − 16 = <b>24</b> cm'},
 {part:'(1)',ph:'calc',ans:1,cap:`BN = ${h}BC = ${h} × 24 = 12 cm`,pts:'A B C N',mid:[16,40],br:{AC:[1,'k'],CN:[1,'d'],NB:[1,'a'],CB:[2,'d'],AB:[3,'k']},
  ln:`BN = ${h}BC = ${h} × 24 = <b class="r">12</b> cm`},
 {part:'(2)',ph:'goal',cap:'題目要求 MN。',pts:'A B C N M',br:{MN:[1,'q','?'],NB:[1,'k'],AB:[3,'k']},ln:'MN = ?'},
 {part:'(2)',ph:'back',cap:'MN = BM − BN。BN 在 (1) 已求出是 12 cm，還缺 BM。',pts:'A B C N M',br:{MN:[1,'q','?'],NB:[1,'g'],MB:[2,'q','?'],AB:[3,'k']},
  ln:'MN = BM − BN，BN = 12 已求得　→ 需要 BM'},
 {part:'(2)',ph:'back',cap:`M 是 AB 的中點，所以 BM = ${h}AB，而 AB 已知。`,pts:'A B C N M',br:{MN:[1,'q','?'],NB:[1,'k'],MB:[2,'q','?'],AB:[3,'g']},
  ln:`M 是 AB 中點，BM = ${h}AB，AB 已知 ✓`},
 {part:'(2)',ph:'calc',cap:`BM = ${h}AB = ${h} × 40 = 20 cm`,pts:'A B C N M',mid:[0,40],br:{MN:[1,'q','?'],NB:[1,'k'],AM:[2,'d'],MB:[2,'d'],AB:[3,'k']},
  ln:`BM = ${h}AB = ${h} × 40 = <b>20</b> cm`},
 {part:'(2)',ph:'calc',ans:1,cap:'MN = BM − BN = 20 − 12 = 8 cm',pts:'A B C N M',br:{MN:[1,'a'],NB:[1,'k'],MB:[2,'d'],AB:[3,'k']},
  ln:'MN = BM − BN = 20 − 12 = <b class="r">8</b> cm'},
 {part:'(3)',ph:'goal',cap:'題目要求 QN，其中 Q 是 BP 的中點。',pts:'A B C N',ext:1,br:{NB:[1,'k'],AB:[3,'k']},ln:'QN = ?'},
 {part:'(3)',ph:'back',cap:'Q 在 N 的左邊，所以 QN = BQ − BN。BN = 12 cm 已知，還缺 BQ。',pts:'A B C N',ext:1,br:{NB:[1,'g'],AB:[3,'k']},
  ln:'QN = BQ − BN，BN = 12 已求得　→ 需要 BQ'},
 {part:'(3)',ph:'back',cap:`Q 是 BP 的中點，所以 BQ = ${h}BP。還缺 BP。`,pts:'A B C N',ext:1,br:{NB:[1,'k'],AB:[3,'k']},
  ln:`Q 是 BP 中點，BQ = ${h}BP　→ 需要 BP`},
 {part:'(3)',ph:'back',cap:'BP 要看 P 在哪裡：P 在「直線」AB 上，PA = 2，所以 P 可能在 A 的右邊，也可能在 A 的左邊。',pts:'A B C N P1 P2',ext:1,br:{PA2:[1,'g'],PA1:[1,'g'],NB:[1,'k'],AB:[3,'g']},
  ln:'BP 由 AB 與 PA 決定；P 在直線上 → 分兩種情況 ✓'},
 {part:'(3) 情況一',ph:'calc',cap:'情況一：P₁ 在 A 右邊（線段 AB 上），BP = AB − PA = 40 − 2 = 38 cm',pts:'A B C N P1',nw:'P1',ext:1,br:{PA1:[1,'k'],NB:[1,'k'],P1B:[3,'d']},
  ln:'BP = AB − PA = 40 − 2 = <b>38</b> cm'},
 {part:'(3) 情況一',ph:'calc',cap:`BQ = ${h}BP = ${h} × 38 = 19 cm`,pts:'A B C N P1 Q1',nw:'Q1',mid:[2,40],ext:1,br:{PA1:[1,'k'],NB:[1,'k'],Q1B:[2,'d'],P1B:[3,'d']},
  ln:`BQ = ${h}BP = ${h} × 38 = <b>19</b> cm`},
 {part:'(3) 情況一',ph:'calc',ans:1,cap:'QN = BQ − BN = 19 − 12 = 7 cm',pts:'A B C N P1 Q1',ext:1,br:{PA1:[1,'k'],Q1N:[1,'a'],NB:[1,'k'],Q1B:[2,'d'],P1B:[3,'d']},
  ln:'QN = BQ − BN = 19 − 12 = <b class="r">7</b> cm'},
 {part:'(3) 情況二',ph:'calc',cap:'情況二：P₂ 在 A 左邊（BA 延長線上），BP = AB + PA = 40 + 2 = 42 cm',pts:'A B C N P2',nw:'P2',ext:1,br:{PA2:[1,'k'],NB:[1,'k'],P2B:[3,'d']},
  ln:'BP = AB + PA = 40 + 2 = <b>42</b> cm'},
 {part:'(3) 情況二',ph:'calc',cap:`BQ = ${h}BP = ${h} × 42 = 21 cm`,pts:'A B C N P2 Q2',nw:'Q2',mid:[-2,40],ext:1,br:{PA2:[1,'k'],NB:[1,'k'],Q2B:[2,'d'],P2B:[3,'d']},
  ln:`BQ = ${h}BP = ${h} × 42 = <b>21</b> cm`},
 {part:'(3) 情況二',ph:'calc',ans:1,cap:'QN = BQ − BN = 21 − 12 = 9 cm',pts:'A B C N P2 Q2',ext:1,br:{PA2:[1,'k'],Q2N:[1,'a'],NB:[1,'k'],Q2B:[2,'d'],P2B:[3,'d']},
  ln:'QN = BQ − BN = 21 − 12 = <b class="r">9</b> cm'},
 {part:'答案',ph:'ans',ans:1,cap:'兩種情況並排：QN 有兩個答案。',pts:'A B C N P1 Q1 P2 Q2',ext:1,br:{Q1N:[1,'a'],NB:[1,'k'],Q2N:[2,'a']},
  ln:'<span class="final">(1) BN = 12 cm　(2) MN = 8 cm　(3) QN = 7 cm 或 9 cm</span>'},
 ]},

/* ---------- 第 5 題 ---------- */
{id:'q5',tab:'第 5 題',range:[-2,32],
 stmt:`<p>已知 AB 長 30，C 是 AB 的中點，AD : DB = 1 : 2，求 BC、AD 及 CD 的長。</p>`,
 groups:{'已知':'已知條件','BC':'求 BC','AD':'求 AD','CD':'求 CD','答案':'答'},
 pts:{A:[0,'A'],D:[10,'D'],C:[15,'C'],B:[30,'B']},
 br:{AB:[0,30,'30'],AC:[0,15,'15'],CB:[15,30,'15'],AD:[0,10,'10'],DB:[10,30,'20'],DC:[10,15,'5']},
 ticks:{t3:[10,20]},
 steps:[
 {part:'已知',ph:'known',cap:'已知 AB = 30，C 是 AB 的中點，AD : DB = 1 : 2。',pts:'A B',br:{AB:[3,'k']},
  ln:'AB = 30；C 是 AB 中點；AD : DB = 1 : 2'},
 {part:'BC',ph:'goal',cap:'先求 BC。',pts:'A B C',br:{CB:[1,'q','?'],AB:[3,'k']},ln:'BC = ?'},
 {part:'BC',ph:'back',cap:`C 是 AB 的中點，所以 BC = ${h}AB，而 AB 已知。`,pts:'A B C',br:{CB:[1,'q','?'],AB:[3,'g']},
  ln:`C 是 AB 中點，BC = ${h}AB，AB 已知 ✓`},
 {part:'BC',ph:'calc',ans:1,cap:`BC = ${h}AB = ${h} × 30 = 15`,pts:'A B C',mid:[0,30],br:{AC:[1,'d'],CB:[1,'a'],AB:[3,'k']},
  ln:`BC = ${h}AB = ${h} × 30 = <b class="r">15</b>`},
 {part:'AD',ph:'goal',cap:'再求 AD。',pts:'A B C D',br:{AD:[1,'q','?'],AB:[3,'k']},ln:'AD = ?'},
 {part:'AD',ph:'back',cap:`AD : DB = 1 : 2，設 AD = ${X}，則 DB = 2${X}。要求 AD，就是要求 ${X}。`,pts:'A B C D',tk:'t3',br:{AD:[1,'q','x'],DB:[1,'q','2x'],AB:[3,'k']},

/* ================= 引擎 ================= */
const $=id=>document.getElementById(id);
const svg=$('svg'), list=$('lines'), range=$('range');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wide=matchMedia('(min-width: 861px)');
let P, S, ptEl, brEl, tkEl, ext, liEl, hdr, cur=-1, timer=null, pending=[];

function load(p){
  stop(); P=p; S=p.steps; [MIN,MAX]=p.range; cur=-1;
  pending.forEach(clearTimeout); pending=[];
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===p.id));
  $('stmt').innerHTML=V(p.stmt);

  svg.innerHTML=''; ptEl={}; brEl={}; tkEl={};
  ext=el('path',{class:'ext',d:`M${x(MIN)} ${Y}H${x(0)}M${x(p.pts.B[0])} ${Y}H${x(MAX)}`});
  el('path',{class:'axis',d:`M${x(0)} ${Y}H${x(p.pts.B[0])}`});
  for(const k in (p.ticks||{})){
    const g=el('g',{class:'tk'});
    p.ticks[k].forEach(v=>el('line',{x1:x(v),x2:x(v),y1:Y-6,y2:Y+6},g));
    tkEl[k]=g;
  }
  for(const k in p.br){
    const [a,b,t]=p.br[k], x1=x(a), x2=x(b), m=(x1+x2)/2;
    const g=el('g',{class:'br'});
    el('rect',{class:'hl',x:m-20,y:-27,width:40,height:19,rx:3},g);
    el('path',{d:`M${x1+1} 0V-8H${x2-1}V0`,pathLength:1},g);
    const tx=el('text',{x:m,y:-13},g); tx.textContent=t;
    g.style.transform=`translate(0px,${Y-6-GAP}px)`;
    brEl[k]=g;
  }
  for(const k in p.pts){
    const [v,lb]=p.pts[k];
    const g=el('g',{class:'pt'});
    g.style.transform=`translate(${x(v)}px,${Y}px)`;
    el('line',{x1:0,y1:-7,x2:0,y2:7},g);
    el('circle',{cx:0,cy:0,r:3.2},g);
    const t=el('text',{class:'lb',x:0,y:32},g); t.textContent=lb;
    const c=el('text',{class:'co',x:0,y:50},g); c.textContent=v;
    ptEl[k]=g;
  }

  list.innerHTML=''; liEl=[]; hdr=[];
  let lastGrp='', lastPart='';
  S.forEach((s,i)=>{
    const grp=s.part.split(' ')[0];
    if(grp!==lastGrp){
      const e=document.createElement('h3'); e.innerHTML=V(p.groups[grp]||grp);
      e.dataset.from=i; list.appendChild(e); hdr.push(e); lastGrp=grp;
    }
    if(s.part!==lastPart && p.subs && p.subs[s.part]){
      const e=document.createElement('h4'); e.innerHTML=V(p.subs[s.part]);
      e.dataset.from=i; list.appendChild(e); hdr.push(e);
    }
    lastPart=s.part;
    const li=document.createElement('li');
    li.className=s.ph; li.tabIndex=0;
    li.innerHTML=`<span class="ph ${s.ph}">${PHN[s.ph]}</span><span class="tx">${V(s.ln)}</span>`;
    li.addEventListener('click',()=>{stop();go(i)});
    li.addEventListener('keydown',e=>{if(e.key==='Enter'){stop();go(i)}});
    list.appendChild(li); liEl.push(li);
  });
  range.max=S.length-1;
  go(0);
}

function go(i){
  i=Math.max(0,Math.min(S.length-1,i));
  const fwd=i===cur+1, s=S[i];
  pending.forEach(clearTimeout); pending=[];
  svg.querySelectorAll('.runner').forEach(r=>r.remove());
  const animMid=fwd&&s.mid&&!reduce, delay=animMid?950:0;
  const on=new Set(s.pts.split(' '));

  for(const k in ptEl){
    const g=ptEl[k], was=g.classList.contains('on'), want=on.has(k);
    g.classList.toggle('new',k===s.nw);
    g.style.transitionDelay=(want&&!was&&k===s.nw&&animMid)?delay+'ms':'0ms';
    g.classList.toggle('on',want);
  }
  for(const k in brEl){
    const g=brEl[k], spec=s.br[k], was=g.classList.contains('on'), p=g.querySelector('path');
    if(spec){
      const [lv,role,label]=spec, wasQ=g.classList.contains('q');
      g.classList.remove('k','g','d','q','a'); g.classList.add(role);
      const txt=g.querySelector('text'); txt.textContent=label??P.br[k][2];
      txt.classList.toggle('alg',/x/.test(txt.textContent));
      g.style.transform=`translate(0px,${Y-6-lv*GAP}px)`;
      const d=((!was||wasQ)&&animMid)?delay+'ms':'0ms';
      g.style.transitionDelay=d; p.style.transitionDelay=d;
      if(wasQ&&role!=='q'){ // 由「?」變成數值：重畫一次
        p.style.transition='none'; p.style.strokeDashoffset='1'; p.getBoundingClientRect();
        p.style.transition=''; p.style.strokeDashoffset='';
      }
      g.classList.add('on');
    }else{
      g.style.transitionDelay='0ms'; p.style.transitionDelay='0ms';
      g.classList.remove('on');
    }
  }
  ext.classList.toggle('on',!!s.ext);
  for(const k in tkEl) tkEl[k].classList.toggle('on',s.tk===k);

  if(animMid){
    const [a,b]=s.mid, m=(a+b)/2;
    [a,b].forEach(v=>{
      const r=el('circle',{class:'runner',cx:x(v),cy:Y,r:6});
      r.animate([{transform:'translate(0px,0px)'},{transform:`translate(${x(m)-x(v)}px,0px)`}],
        {duration:900,easing:'cubic-bezier(.45,.05,.3,1)',fill:'forwards'});
      pending.push(setTimeout(()=>r.remove(),1000));
    });
  }

  cur=i;
  $('cap').innerHTML=V(s.cap);
  const tag=$('tag'); tag.className='ph '+s.ph; tag.textContent=PHN[s.ph];
  $('part').innerHTML=(s.part==='已知'||s.part==='答案')?'':V(P.groups[s.part.split(' ')[0]]+(s.part.includes(' ')?' · '+s.part.split(' ')[1]:''));
  liEl.forEach((li,j)=>{li.hidden=j>i; li.classList.toggle('now',j===i)});
  hdr.forEach(e=>{e.hidden=+e.dataset.from>i});
  range.value=i; $('count').textContent=`第 ${i+1} / ${S.length} 步`;
  $('prev').disabled=i===0; $('next').disabled=i===S.length-1;
  if(wide.matches && fwd) liEl[i].scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
}

function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ 自動播放'}
function play(){
  if(cur===S.length-1) go(0);
  $('play').textContent='❚❚ 暫停';
  timer=setInterval(()=>{ if(cur>=S.length-1){stop();return} go(cur+1) },3000);
}
$('play').onclick=()=>timer?stop():play();
$('next').onclick=()=>{stop();go(cur+1)};
$('prev').onclick=()=>{stop();go(cur-1)};
$('reset').onclick=()=>{stop();go(0)};
range.oninput=()=>{stop();go(+range.value)};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='LI')return;
  if(e.key==='ArrowRight'){stop();go(cur+1)}
  else if(e.key==='ArrowLeft'){stop();go(cur-1)}
  else if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();timer?stop():play()}
});

const tabs=$('tabs');
PROBS.forEach(p=>{
  const b=document.createElement('button');
  b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+p.id; b.dataset.id=p.id; b.textContent=p.tab;
  b.onclick=()=>{ try{history.replaceState(null,'','#'+p.id)}catch(e){} load(p); };
  tabs.appendChild(b);
});
const start=PROBS.find(p=>'#'+p.id===location.hash)||PROBS[0];
load(start);
})();
</script>
